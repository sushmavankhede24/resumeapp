name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: resume_db
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: myuser@123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Compose
        run: |
          docker-compose build
          docker-compose run web pytest

      - name: Tear down
        run: docker-compose down -v
